service: tokenhandler

# The dev stage supports SPA development and the deployed stage is for the SPA running in Cloudfront
stages:
  dev:
    params:
      domainName: 'bff.authsamples-dev.com'
      certificateArn: 'arn:aws:acm:eu-west-2:090109105180:certificate/b2f2c46a-582a-4e3a-9521-91b54a455703'
  deployed:
    params:
      domainName: 'bff.authsamples.com'
      certificateArn: 'arn:aws:acm:eu-west-2:090109105180:certificate/953873fe-43f7-4e6f-90fe-3227ce194d6e'

# AWS base details
provider:
  name: aws
  runtime: nodejs24.x
  region: eu-west-2

# Lambda functions for the OAuth agent endpoints
functions:

  startLogin:
    handler: dist/startLogin.handler
    package:
      include:
        - dist/startLogin.js
        - config.json
        - package.json
    events:
      - http: 
          path: /login/start
          method: POST

  endLogin:
    handler: dist/endLogin.handler
    package:
      include:
        - dist/endLogin.js
        - config.json
        - package.json
    events:
      - http: 
          path: /login/end
          method: POST

  session:
    handler: dist/session.handler
    package:
      include:
        - dist/session.js
        - config.json
        - package.json
    events:
      - http: 
          path: /session
          method: GET
  
  userInfo:
    handler: dist/userInfo.handler
    package:
      include:
        - dist/userInfo.js
        - config.json
        - package.json
    events:
      - http: 
          path: /userinfo
          method: GET

  refresh:
    handler: dist/refresh.handler
    package:
      include:
        - dist/refresh.js
        - config.json
        - package.json
    events:
      - http: 
          path: /refresh
          method: POST

  logout:
    handler: dist/logout.handler
    package:
      include:
        - dist/logout.js
        - config.json
        - package.json
    events:
      - http: 
          path: /logout
          method: POST

  expireAccess:
    handler: dist/expireAccess.handler
    package:
      include:
        - dist/expireAccess.js
        - config.json
        - package.json
    events:
      - http: 
          path: /access/expire
          method: POST

  expireRefresh:
    handler: dist/expireRefresh.handler
    package:
      include:
        - dist/expireRefresh.js
        - config.json
        - package.json
    events:
      - http: 
          path: /refresh/expire
          method: POST          

# Disable the default build which we are overriding with a bundler
build:
  esbuild: false

# Exclude all files by default and choose files in the function packaging above
package:
  individually: true
  patterns:
  - '!/**'

# Support running OAuth agent endpoints locally
plugins:
  - serverless-offline

resources:

  Conditions:
    IsDev:
      Fn::Equals:
        - ${sls:stage}
        - dev
    IsDeployed:
      Fn::Equals:
        - ${sls:stage}
        - deployed

  Resources:

    # Take ownership of the BFF domain
    BffDomain:
      Type: AWS::ApiGateway::DomainName
      Properties:
        DomainName: ${param:domainName}
        EndpointConfiguration:
          Types:
            - REGIONAL
        RegionalCertificateArn: ${param:certificateArn}
        SecurityPolicy: SecurityPolicy_TLS13_1_3_2025_09
        EndpointAccessMode: STRICT

    # Use the root path
    BffDomainMapping:
      Type: AWS::ApiGateway::BasePathMapping
      Properties:
        DomainName: !Ref BffDomain
        BasePath: oauth-agent
        RestApiId:
          Ref: ApiGatewayRestApi
        Stage: ${sls:stage}

    # Limit cloudwatch log retention 
    StartLoginLogGroup:
      Type: 'AWS::Logs::LogGroup'
      Properties:
        RetentionInDays: '5'
    EndLoginLogGroup:
      Type: 'AWS::Logs::LogGroup'
      Properties:
        RetentionInDays: '5'

  # Export the BFF domain so that its hostname can be added as an extra API route, e.g. https://bff.authsamples.com/investments
  Outputs:
    BffDomainName:
      Description: The BFF domain in the same site as the SPA
      Value:
        Ref: BffDomain
      Export:
        Name: BffDomainName-${sls:stage}
