service: tokenhandler

# Details for the two AWS deployed stages
stages:
  dev:
    params:
      domainName: 'bff.authsamples-dev.com'
      certificateArn: 'arn:aws:acm:eu-west-2:090109105180:certificate/b2f2c46a-582a-4e3a-9521-91b54a455703'
  deployed:
    params:
      domainName: 'bff.authsamples.com'
      certificateArn: 'arn:aws:acm:eu-west-2:090109105180:certificate/953873fe-43f7-4e6f-90fe-3227ce194d6e'

# AWS base details
provider:
  name: aws
  runtime: nodejs24.x
  region: eu-west-2

  # Domain and certificate details
  domain:
    name: ${param:domainName}
    securityPolicy: SecurityPolicy_TLS13_1_3_2025_09
    accessMode: strict
    endpointType: regional
    certificateArn: ${param:certificateArn}


# A single lambda function covers all token handler routes
functions:
  wildcard:
    handler: dist/wildcard.handler
    package:
      include:
        - dist/wildcard.js
        - config.json
        - package.json
    events:
      - http: 
          path: /{proxy+}
          method: ANY

# Disable the default build which we are overriding with a bundler
build:
  esbuild: false

# Exclude all files by default and choose files in the function packaging above
package:
  individually: true
  patterns:
  - '!/**'

resources:
  Resources:

    # Limit cloudwatch log retention 
    WildcardLogGroup:
      Type: 'AWS::Logs::LogGroup'
      Properties:
        RetentionInDays: '5'
